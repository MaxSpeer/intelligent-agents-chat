[project]
name = "intelligent-agents-vllm-runtime"
version = "0.1.0"
description = "Linux/CUDA vLLM runtime for the Intelligent Agents project."
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai>=2,<3",
    "uv==0.12.1",
    "vllm==0.23.0",
]

[tool.uv]
package = false
required-version = ">=0.12,<0.13"
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
