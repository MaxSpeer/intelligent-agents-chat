[project]
name = "intelligent-agents-chat"
version = "0.1.0"
description = "A minimal NiceGUI starter for the Intelligent Agents project."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ddgs>=9.15.0",
    "fastembed>=0.8,<0.9",
    "httpx>=0.28.1",
    "nicegui>=3.0,<4",
    "openai>=2,<3",
    "pypdf>=6,<7",
    "sqlite-vec>=0.1.9,<0.2",
    "trafilatura>=2.2.0",
]

[project.scripts]
intelligent-agents-chat = "intelligent_agents_chat.main:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.12",
]

[tool.ruff]
line-length = 100

[tool.uv]
required-version = ">=0.12,<0.13"

[tool.pytest.ini_options]
pythonpath = ["."]
