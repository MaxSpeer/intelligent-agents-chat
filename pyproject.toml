[project]
name = "intelligent-agents-chat"
version = "0.1.0"
description = "A minimal NiceGUI starter for the Intelligent Agents project."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "nicegui>=3.0,<4",
]

[project.scripts]
intelligent-agents-chat = "intelligent_agents_chat.app:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.12",
]

[tool.ruff]
line-length = 100
